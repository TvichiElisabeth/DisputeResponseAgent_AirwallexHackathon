<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dispute Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
</head>
<body>
  {% block content %}{% endblock %}

  <!-- Shown while a review runs: the agent's real steps, as each one finishes. -->
  <div id="review-overlay" class="overlay" hidden>
    <div class="overlay-card" role="status" aria-live="polite">
      <div class="overlay-head">
        <div class="overlay-title">Agent is reviewing the queue</div>
        <div class="overlay-sub">Code decides the money. The model reads and explains.</div>
      </div>
      <ol class="steps" id="review-steps"></ol>
    </div>
  </div>

  <!-- The agent run drawer. Outside #main, so a page re-draw never closes it. -->
  <div id="run-root"></div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script>
    // ---- Side sheets (demo controls, details, raw text). They live in #main, so
    //      they start closed after every swap; only one is open at a time. ----
    let lastOpener = null;
    function closeSheets() {
      document.querySelectorAll(".sheet.open").forEach(s => s.classList.remove("open"));
      document.querySelectorAll("[data-sheet]").forEach(b => b.setAttribute("aria-expanded", "false"));
      document.body.classList.remove("sheet-open");
      if (lastOpener && document.body.contains(lastOpener)) lastOpener.focus();
    }
    function openSheet(id, opener) {
      closeSheets();
      const s = document.getElementById(id);
      if (!s) return;
      lastOpener = opener;
      s.classList.add("open");
      opener?.setAttribute("aria-expanded", "true");
      document.body.classList.add("sheet-open");
      s.querySelector("[data-sheet-close]")?.focus();
    }
    document.addEventListener("click", (e) => {
      const opener = e.target.closest("[data-sheet]");
      if (opener) { openSheet(opener.dataset.sheet, opener); return; }
      if (e.target.closest("[data-sheet-close]") || e.target.classList.contains("scrim")) closeSheets();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !document.querySelector("#run-root .rundrawer")) closeSheets();
    });
    document.addEventListener("htmx:afterSwap", () => document.body.classList.remove("sheet-open"));

    // ---- Brand splash: the sidebar logo opens it; Esc, Close or "Open the queue" closes it ----
    document.addEventListener("click", (e) => {
      const splash = document.getElementById("splash");
      if (!splash) return;
      if (e.target.closest("[data-splash]")) { splash.showModal(); return; }
      if (e.target.closest("[data-splash-close]")) splash.close();
    });

    // ---- Tabs: inactive panels are hidden, never removed, so the escalation
    //      form still submits every checkbox and the reply. ----
    document.addEventListener("click", (e) => {
      const tab = e.target.closest("[role=tab]");
      if (!tab || !tab.getAttribute("aria-controls")) return;   // run tabs load from the server
      const list = tab.closest("[role=tablist]");
      list.querySelectorAll("[role=tab]").forEach(t => {
        const on = t === tab;
        t.setAttribute("aria-selected", on);
        t.tabIndex = on ? 0 : -1;
        document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
      });
    });

    // ---- Queue: whole row opens the case; search and deadline filter in the browser ----
    document.addEventListener("click", (e) => {
      const row = e.target.closest("tr[data-href]");
      if (row && !e.target.closest("a, button")) location.href = row.dataset.href;
    });
    function filterQueue() {
      const q = (document.getElementById("q")?.value || "").trim().toLowerCase();
      const due = document.getElementById("due")?.value || "any";
      let shown = 0;
      document.querySelectorAll("#queue-body tr").forEach(tr => {
        const days = parseFloat(tr.dataset.days);
        const okDue = due === "any" || (!isNaN(days) && days > 0 && days <= parseFloat(due));
        const okText = !q || tr.dataset.search.includes(q);
        tr.hidden = !(okDue && okText);
        if (!tr.hidden) shown++;
      });
      const empty = document.getElementById("queue-empty");
      if (empty) empty.hidden = shown > 0;
    }
    document.addEventListener("input", (e) => { if (e.target.matches("#q, #due")) filterQueue(); });
    document.addEventListener("htmx:afterSwap", filterQueue);

    // ---- Copy the reply to the clipboard ----
    document.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-copy]");
      if (!btn) return;
      const text = document.querySelector(btn.dataset.copy)?.innerText || "";
      navigator.clipboard.writeText(text).then(() => {
        const label = btn.querySelector("span") || btn;
        const old = label.textContent;
        label.textContent = "Copied";
        setTimeout(() => (label.textContent = old), 1500);
      });
    });

    // ---- Review progress: the review runs in the background on the server; this
    //      polls its real steps (each finished tool call and model turn) every 500 ms,
    //      then re-draws the page. Polling, not a stream: it works the same through
    //      CloudFront, a load balancer and several containers. ----
    let polling = null;
    function renderSteps(steps, running) {
      const esc = (s) => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
      const rows = steps.map(s => `<li class="${s.error ? "done is-error" : "done"}"><span class="step-icon"></span><span>${esc(s.label)}</span></li>`);
      if (running) rows.push(`<li class="active"><span class="step-icon"></span><span>${steps.length ? "Working…" : "Starting the agent…"}</span></li>`);
      const list = document.getElementById("review-steps");
      list.innerHTML = rows.join("");
      list.lastElementChild?.scrollIntoView({block: "nearest"});
    }
    function redraw() {
      return htmx.ajax("GET", location.pathname + location.search, {target: "#main", select: "#main", swap: "outerHTML"})
        .catch(() => location.reload());
    }
    function followReview(id) {
      if (polling === id) return;
      polling = id;
      document.getElementById("review-overlay").hidden = false;
      renderSteps([], true);
      const tick = async () => {
        if (polling !== id) return;
        let job;
        try {
          const r = await fetch(`/review/${id}/progress`, {cache: "no-store"});
          if (!r.ok) throw new Error(r.status);
          job = await r.json();
        } catch (_) { setTimeout(tick, 1500); return; }      // brief network blip: keep trying
        renderSteps(job.steps, job.status === "running");
        if (job.status === "running") { setTimeout(tick, 500); return; }
        polling = null;
        if (job.status === "error") toast("The review stopped: " + job.error);
        await redraw();
        document.getElementById("review-overlay").hidden = true;
      };
      tick();
    }
    document.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-review]");
      if (!btn) return;
      btn.disabled = true;
      try {
        const r = await fetch("/review", {method: "POST"});
        if (!r.ok) throw new Error(r.status);
        followReview((await r.json()).id);
      } catch (_) { btn.disabled = false; toast("Couldn't start the review."); }
    });
    // A review already running (page reloaded, or someone else started it): follow it.
    function resumeReview() {
      const id = document.getElementById("main")?.dataset.reviewing;
      if (id) followReview(id);
    }
    document.addEventListener("DOMContentLoaded", resumeReview);
    document.addEventListener("htmx:afterSwap", resumeReview);

    // ---- Agent run drawer: opened from "View agent run" / "See what the agent did".
    //      The server renders one run; tabs load another; spans select in place. ----
    let runOpener = null;
    const runRoot = () => document.getElementById("run-root");
    async function loadRun(url) {
      const r = await fetch(url, {cache: "no-store"});
      runRoot().innerHTML = await r.text();
      document.body.classList.add("sheet-open");
      (runRoot().querySelector(".runtab[aria-selected=true]") || runRoot().querySelector(".rundrawer"))?.focus();
    }
    function closeRun() {
      if (!runRoot().innerHTML) return;
      runRoot().innerHTML = "";
      document.body.classList.remove("sheet-open");
      if (runOpener && document.body.contains(runOpener)) runOpener.focus();
    }
    document.addEventListener("click", (e) => {
      const opener = e.target.closest("[data-run]");
      if (opener) {
        if (!opener.closest("#run-root")) runOpener = opener;   // tabs keep the original opener
        loadRun(opener.dataset.run).catch(() => toast("Couldn't load the agent run."));
        return;
      }
      if (e.target.closest("[data-run-close]")) { closeRun(); return; }
      const span = e.target.closest("[data-span]");
      if (span) {
        const drawer = span.closest(".rundrawer");
        drawer.querySelectorAll("[data-span]").forEach(b => b.setAttribute("aria-pressed", b === span));
        drawer.querySelectorAll("[data-span-detail]").forEach(d => d.hidden = d.dataset.spanDetail !== span.dataset.span);
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closeRun(); return; }
      // keep Tab inside the open drawer
      const drawer = runRoot().querySelector(".rundrawer");
      if (e.key !== "Tab" || !drawer) return;
      const f = [...drawer.querySelectorAll("button, [href], [tabindex]:not([tabindex='-1'])")].filter(x => !x.hidden && x.offsetParent);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    });

    // ---- Show server or network errors instead of failing silently ----
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.hidden = false;
      clearTimeout(t._timer); t._timer = setTimeout(() => (t.hidden = true), 5000);
    }
    document.addEventListener("htmx:responseError", (e) =>
      toast("Something went wrong on the server (" + e.detail.xhr.status + "). Check the activity log in Demo controls."));
    document.addEventListener("htmx:sendError", () => toast("Can't reach the server."));
  </script>
</body>
</html>
